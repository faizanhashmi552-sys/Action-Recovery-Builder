name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
        - 12.1
        - 11
        - 9.0
        - 8.1
        - 7.1
        - 6.0
        required: true
        default: 12.1
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/faizanhashmi552-sys/android_device_motorola_berlna-twrp
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: twrp-12.1
      DEVICE_PATH:
        description: Device Path
        required: true
        default: device/motorola/berlna
      DEVICE_NAME:
        description: Device Name
        required: true
        default: berlna
      REPOPICK_PATCHES:
        description: (Optional) Gerrit patches
        type: string
        required: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup and Free Disk Space
      run: |
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
          /var/lib/docker /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        docker rmi $(docker images -q) 2>/dev/null || true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install \
          gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libwxgtk3.2-dev libxml2 lzop pngcrush squashfs-tools imagemagick \
          libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev \
          libtinfo6 schedtool python3 python-is-python3
        sudo add-apt-repository universe
        sudo apt -y install libncurses6

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        repo init --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b twrp-${{ inputs.MANIFEST_BRANCH }}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ inputs.DEVICE_TREE_URL }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./${{ inputs.DEVICE_PATH }}
      working-directory: workspace

    - name: Apply Repopick patches
      if: ${{ inputs.REPOPICK_PATCHES != '' }}
      run: |
        source build/envsetup.sh
        for patch in ${{ inputs.REPOPICK_PATCHES }}; do
          repopick $patch
        done
      working-directory: workspace

    - name: Building TWRP boot + vendor_boot
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng || \
          lunch aosp_${{ inputs.DEVICE_NAME }}-eng
        make adbd bootimage vendorbootimage -j$(nproc --all)
      working-directory: workspace

    - name: Check output files
      run: |
        echo "=== Output files ==="
        ls -lh workspace/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img || echo "boot.img NOT FOUND"
        ls -lh workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img || echo "vendor_boot.img NOT FOUND"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
        name: ${{ inputs.DEVICE_NAME }} TWRP - ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          ## TWRP for ${{ inputs.DEVICE_NAME }}
          - Branch: `${{ inputs.MANIFEST_BRANCH }}`
          - Device Tree: `${{ inputs.DEVICE_TREE_BRANCH }}`

          ## Flash instructions
```
          fastboot flash boot boot.img
          fastboot flash vendor_boot vendor_boot.img
          fastboot reboot
```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
